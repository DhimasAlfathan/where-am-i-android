<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="leaflet.css"><style>
html,body,#map{height:100%;margin:0;background:#e9efe8;font-family:Arial,sans-serif}.leaflet-control-attribution{font-size:10px}.location-pin{background:transparent;border:0}.location-pin span{display:block;width:30px;height:30px;background:#16734e;border:4px solid white;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);box-shadow:0 3px 14px #0003}.location-pin span:after{content:'';position:absolute;width:8px;height:8px;border:2px solid white;border-radius:50%;left:13px;top:13px}#error{position:absolute;z-index:1000;top:10px;left:12px;right:55px;background:white;color:#35473c;border-radius:10px;padding:10px;font-size:12px;box-shadow:0 2px 8px #0001}#error[hidden]{display:none}#retry{background:#16734e;color:white;border:0;border-radius:7px;padding:8px;margin-top:8px}
</style></head><body><div id="map" aria-label="Map of selected location"></div><div id="error" role="status" hidden>The map could not load. Check your internet connection.<br><button id="retry">Try again</button></div><script src="leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false}).setView([-6.1754,106.8272],13);
L.control.zoom({position:'topright'}).addTo(map);
const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',keepBuffer:1}).addTo(map);
const error=document.getElementById('error');tiles.on('tileerror',()=>{error.hidden=false;});document.getElementById('retry').onclick=()=>{error.hidden=true;tiles.redraw();};
let pin=null;window.showLocation=function(lat,lon){if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return;const point=[lat,lon];if(pin)pin.setLatLng(point);else pin=L.marker(point,{icon:L.divIcon({className:'location-pin',html:'<span></span>',iconSize:[38,38],iconAnchor:[19,38]}),keyboard:false}).addTo(map);map.setView(point,16,{animate:false});};
</script></body></html>
